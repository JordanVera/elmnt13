<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #f4efe6; }
  .wrap { padding: 40px 24px; }
  p { text-align: center; font: 11px/1 sans-serif; letter-spacing: .36em; color: rgba(17,17,17,.5); text-transform: uppercase; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 64px; padding: 0 32px; }
  .logo { display: flex; align-items: center; justify-content: center; height: 36px; flex-shrink: 0; background: rgba(255,0,0,.06); }
  .logo.hennessy { height: calc(36px * 1.35); }
  img { height: 100%; width: auto; max-width: 192px; object-fit: contain; filter: grayscale(1); opacity: .9; }
</style>
</head>
<body>
<div class="wrap">
  <p>Brands We’ve Worked With</p>
  <div class="row">
    <span class="logo"><img src="tedx.svg"></span>
    <span class="logo"><img src="karen-civil.png"></span>
    <span class="logo"><img src="hair-and-the-blog.png"></span>
    <span class="logo"><img src="king-me.svg"></span>
    <span class="logo"><img src="headlines.svg"></span>
    <span class="logo"><img src="k-swiss.svg"></span>
    <span class="logo"><img src="foot-locker.svg"></span>
    <span class="logo hennessy"><img src="hennessy.svg"></span>
  </div>
</div>
</body>
</html>
